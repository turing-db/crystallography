[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccdc-demo"
version = "0.1.0"
description = "TuringDB crystallography demo over the Crystallography Open Database (COD)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # CIF parsing, crystallographic symmetry, unit-cell maths. C++ underneath.
    "gemmi>=0.6.6",
    # Fragment perception (SMARTS) and InChIKey generation.
    "rdkit>=2024.3.1",
    "numpy>=1.26",
    "scipy>=1.13",
    # Downloader: HTTP for the release manifest, progress for the long rsync.
    "httpx>=0.27",
    "tqdm>=4.66",
    # COD publishes a public read-only MySQL mirror; pure-python driver keeps
    # the install free of a C build step.
    "pymysql>=1.1",
    # TuringDB Python SDK. The server binary ships inside this wheel, so there
    # is no separate install step.
    "turingdb",
]

[project.scripts]
crystal = "crystal:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["ingest", "queries"]
only-include = ["ingest", "queries", "crystal.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Correctness rules, not house style: pyflakes (unused names, duplicate dict
# keys, undefined names), syntax errors, comparison-with-itself, and loop
# variables captured by closures.
select = ["F", "E9", "PLR0124", "B023"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

# No pytest config: tests/ holds executable checks that take a live server and
# report by exit code, not pytest test functions. Configuring pytest over a
# directory with no tests gives a step that always passes while running
# nothing.
