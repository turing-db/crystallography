[project]
name = "ccdc-demo"
version = "0.1.0"
description = "TuringDB crystallography demo over the Crystallography Open Database (COD)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # CIF parsing, crystallographic symmetry, unit-cell maths. C++ underneath.
    "gemmi>=0.6.6",
    # Fragment perception (SMARTS) and InChIKey generation.
    "rdkit>=2024.3.1",
    "numpy>=1.26",
    "scipy>=1.13",
    # Metadata dump handling + ingest reporting.
    "pandas>=2.2",
    "pyarrow>=16.0",
    # Downloader.
    "httpx>=0.27",
    "tqdm>=4.66",
    # COD publishes a public read-only MySQL mirror; pure-python driver keeps
    # the install free of a C build step.
    "pymysql>=1.1",
    # TuringDB Python SDK. The server binary ships inside this wheel, so there
    # is no separate install step.
    "turingdb",
    # Backend.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
bench = [
    "neo4j>=5.20",
]
dev = [
    "pytest>=8.2",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
